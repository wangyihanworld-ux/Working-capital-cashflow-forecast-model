[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"
[project]
name="working-capital-cashflow-forecast"
version="1.0.0"
description="Synthetic working capital and cash flow forecast model"
requires-python=">=3.10"
dependencies=["numpy>=1.24,<3","pandas>=2,<3","openpyxl>=3.1,<4"]
[project.scripts]
working-capital-demo="working_capital.demo:main"
[tool.setuptools.packages.find]
where=["src"]

